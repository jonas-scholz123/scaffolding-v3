[project]
name = "scaffolding-v3"
version = "0.1.0"
description = "A Scaffolding for Quickstarting your ML Experiments"
authors = [{ name = "Jonas Scholz", email = "jonas.scholz123@gmail.com" }]
dependencies = [
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "tqdm>=4.67.1",
    "matplotlib>=3.10.8",
    "hydra-core>=1.3.2",
    "loguru>=0.7.3",
    "wandb>=0.23.1",
    "python-dotenv>=1.2.1",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "requests>=2.32.5",
    "beautifulsoup4>=4.14.3",
    "ipykernel>=7.1.0",
    "hydra-optuna-sweeper>=1.2.0",
    "hydra-submitit-launcher>=1.2.0",
    "ruff>=0.14.9",
    "ty>=0.0.3",
    "pre-commit>=4.5.1",
    "mlbnb>=0.1.6",
]
requires-python = "==3.11.*"
readme = "README.md"
license = { text = "MIT" }

[tool.ty.environment]
root = ["./src"]

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
mlbnb = { path = "../mlbnb", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
